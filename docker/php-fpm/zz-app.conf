; Extend the default [www] pool defined by the base php:fpm image.
;
; clear_env = no is essential: Render injects configuration (database
; credentials, APP_KEY, ...) as environment variables, and php-fpm clears the
; environment for worker processes unless told otherwise. Without this, Laravel
; would see an empty environment and fail to connect.
[www]
clear_env = no
catch_workers_output = yes

pm = dynamic
pm.max_children = 20
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4
