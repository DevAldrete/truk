; Production PHP settings for Truk.

memory_limit = 256M
max_execution_time = 60

; Keep these in step with docker/nginx/default.conf.template (client_max_body_size)
; and the application's config/uploads.php ceiling.
upload_max_filesize = 12M
post_max_size = 12M

expose_php = Off
date.timezone = UTC

; OPcache. The image is immutable, so timestamps never need revalidating.
opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
