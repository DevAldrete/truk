# Local development services for Truk.
#
# PostgreSQL is the production source of truth (see IDEA.md/PROCESS.md); SQLite
# is only used for the test suite (`phpunit.xml` pins it to `:memory:`).
#
#   docker compose up -d --wait   # start and wait until healthy
#   docker compose down           # stop (keeps the volume)
#   docker compose down -v        # stop and delete the data
#
# Credentials come from the root `.env`, so the app and the container agree.
services:
    postgres:
        image: postgres:16-alpine
        container_name: truk-postgres
        restart: unless-stopped
        environment:
            POSTGRES_DB: ${DB_DATABASE:-truk}
            POSTGRES_USER: ${DB_USERNAME:-truk}
            POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
            PGDATA: /var/lib/postgresql/data/pgdata
        ports:
            - '${DB_PORT:-5432}:5432'
        volumes:
            - truk-pgdata:/var/lib/postgresql/data
        healthcheck:
            test:
                - CMD-SHELL
                - pg_isready -U ${DB_USERNAME:-truk} -d ${DB_DATABASE:-truk}
            interval: 5s
            timeout: 5s
            retries: 10

volumes:
    truk-pgdata:
